<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>張芯瑜 履歷</title>

<style>
body {
font-family: Arial, sans-serif;
background-color: #f5f5f5;
margin: 0;
padding: 40px;
}

.photo-rect {
display: block;
margin: 20px auto;
width: 300px; /* 比較大 */
height: auto;
border-radius: 0; /* 方形 */
}
.container {
max-width: 800px;
margin: auto;
background: white;
padding: 30px;
border-radius: 15px;
box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

/* 標題 */
h1 {
text-align: center;
margin-bottom: 5px;
}

.student-id {
text-align: center;
color: gray;
margin-bottom: 20px;
}

/* 圖片 */
.photo {
display: block;
margin: 20px auto;
width: 150px;
height: 150px;
border-radius: 50%;
object-fit: cover;
}

/* 每區塊 */
section {
margin-bottom: 25px;
}

h2 {
border-left: 5px solid #333;
padding-left: 10px;
}

/* 技能排版 */
.skills {
display: flex;
gap: 20px;
}

.skills ul {
padding-left: 20px;
}
</style>

</head>

<body>

<div class="container">

<!-- 名字 + 學號 -->
<h1>張芯瑜</h1>
<p class="student-id">學號：114055057</p>

<!-- 第一張照片 -->
<img src="images/me.jpeg" class="photo">

<!-- 學歷 -->
<section>
<h2>學歷</h2>
<p>亞洲大學 室內設計系 一年級</p>
</section>

<!-- 履歷內容 -->
<section>
<h2>個人簡介</h2>
<p>我是亞洲大學一年級學生，對室內設計充滿興趣，喜歡觀察空間與美感，希望未來能成為專業設計師。</p>
</section>

<section>
<h2>技能</h2>
<ul>
<li>AutoCAD</li>
<li>空間規劃</li>
<li>手繪設計</li>
</ul>
</section>

<section>
<h2>興趣</h2>
<ul>
<li>聽音樂</li>
<li>看設計作品</li>
<li>拍照</li>
</ul>
</section>

<!-- 第二張照片 -->
<img src="images/photo.jpg" class="photo-rect">

<!-- 職業目標 -->
<section>
<h2>職業目標</h2>
<p>未來希望成為一名室內設計師，並開設自己的室內設計公司。</p>
</section>

</div>

</body>
</html>
