<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>張芯瑜 履歷</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background-color: #f5f5f5;
}

/* 整體卡片 */
.resume {
display: flex;
max-width: 900px;
margin: 40px auto;
background: white;
box-shadow: 0 5px 20px rgba(0,0,0,0.1);
border-radius: 10px;
overflow: hidden;
}

/* 左邊 */
.left {
width: 30%;
background-color: #2c3e50;
color: white;
text-align: center;
padding: 30px 20px;
}

.left h2 {
margin: 10px 0;
}

/* 上面圓形 */
.photo {
width: 120px;
height: 120px;
border-radius: 50%;
object-fit: cover;
}

/* 🔥下面大張方形 */
.photo-rect {
width: 200px;
height: 200px;
object-fit: cover;
margin-top: 20px;
}

/* 右邊 */
.right {
width: 70%;
padding: 30px;
}

/* 大標題 */
.right h1 {
margin-top: 0;
}

/* 每區塊 */
.section {
margin-bottom: 25px;
}

/* 小標題 */
.section h2 {
border-left: 5px solid #3498db;
padding-left: 10px;
margin-bottom: 10px;
}

/* 清單 */
ul {
padding-left: 20px;
}

/* 🎵 音樂按鈕 */
#musicBtn {
position: fixed;
bottom: 20px;
right: 20px;
padding: 12px;
border: none;
border-radius: 50%;
background: rgba(0,0,0,0.6);
color: white;
font-size: 18px;
cursor: pointer;
transition: 0.3s;
}

#musicBtn:hover {
transform: scale(1.2);
}

/* 🎵 左下角文字 */
#musicText {
position: fixed;
left: 20px;
bottom: 20px;
background: rgba(0,0,0,0.5);
color: white;
padding: 8px 12px;
border-radius: 10px;
font-size: 14px;
}
</style>
</head>

<body>

<div class="resume">

<!-- 左邊 -->
<div class="left">
<img src="images/me.jpeg" class="photo">
<h2>張芯瑜</h2>
<p>亞洲大學學生</p>
<p>學號：114055057</p>

<!-- 大張方形 -->
<img src="images/photo.jpg" class="photo-rect">
</div>

<!-- 右邊 -->
<div class="right">
<h1>張芯瑜</h1>

<div class="section">
<h2>學歷</h2>
<p>亞洲大學 室內設計系 一年級</p>
</div>

<div class="section">
<h2>個人簡介</h2>
<p>
我是亞洲大學室內設計系一年級學生，對空間設計與美感充滿興趣，
喜歡觀察環境並從中獲得靈感，期望未來成為專業設計師。
</p>
</div>

<div class="section">
<h2>職業目標</h2>
<p>
希望未來能進入室內設計相關產業，累積實務經驗，
並創立自己的設計公司，打造具有特色的空間作品。
</p>
</div>

<div class="section">
<h2>技能</h2>
<ul>
<li>AutoCAD</li>
<li>空間規劃</li>
<li>手繪設計</li>
</ul>
</div>

<div class="section">
<h2>興趣</h2>
<ul>
<li>拍照</li>
<li>聽音樂</li>
<li>欣賞設計作品</li>
</ul>
</div>
</div>
</div>

<!-- 🎵 背景音樂 -->
<audio autoplay loop muted id="bgm">
<source src="music/song.mp3" type="audio/mpeg">
</audio>

<!-- 🎵 音樂按鈕 -->
<button id="musicBtn">🔇</button>

<!-- 🎵 顯示文字 -->
<div id="musicText">🎵 Now Playing</div>

<script>
const audio = document.getElementById("bgm");
const btn = document.getElementById("musicBtn");

// 解鎖音樂（點一次）
document.addEventListener("click", function () {
audio.muted = false;
audio.play();
}, { once: true });

// 按鈕控制
btn.addEventListener("click", function () {
if (audio.paused) {
audio.play();
btn.innerHTML = "🔊";
} else {
audio.pause();
btn.innerHTML = "🔇";
}
});
</script>

</body>
</html>
