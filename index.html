<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>履歷</title>

<style>
body {
margin: 0;
font-family: Arial;
}

/* 左右排版 */
.resume {
display: flex;
}

/* 左邊藍色 */
.left {
width: 30%;
background-color: #2c3e50;
color: white;
padding: 20px;
text-align: center;
}

/* 右邊內容 */
.right {
width: 70%;
padding: 30px;
line-height: 1.6;
}

/* 上面圓形照片（不動） */
.photo {
width: 120px;
height: 120px;
border-radius: 50%;
object-fit: cover;
margin-bottom: 15px;
}

/* 🔥下面大張方形照片 */
.photo-rect {
width: 220px;
height: 220px;
object-fit: cover;
border-radius: 0;
margin-top: 20px;
}

/* 標題底線 */
.right h2 {
border-bottom: 2px solid #ccc;
padding-bottom: 5px;
}

</style>
</head>

<body>

<div class="resume">

<!-- 左邊 -->
<div class="left">
<img src="images/me.jpeg" class="photo">
<h2>張芯瑜</h2>
<p>亞洲大學學生</p>
<p>學號：114055057</p>
<p>年級：一年級</p>
</div>

<!-- 右邊 -->
<div class="right">
<h1>張芯瑜</h1>

<h2>學歷</h2>
<p>亞洲大學 室內設計系 一年級</p>

<h2>個人簡介</h2>
<p>
我是亞洲大學一年級學生，對室內設計充滿興趣，
喜歡觀察空間與設計，希望未來能成為專業設計師。
</p>

<h2>技能</h2>
<ul>
<li>AutoCAD</li>
<li>空間規劃</li>
<li>手繪設計</li>
</ul>

<h2>興趣</h2>
<ul>
<li>拍照</li>
<li>唱歌</li>
</ul>

<!-- 🔥下面那張大圖 -->
<img src="images/photo.jpg" class="photo-rect">

</div>

</div>

</body>
</html>
