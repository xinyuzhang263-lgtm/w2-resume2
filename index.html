<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>履歷</title>

<style>
body {
margin: 0;
font-family: Arial;
}

.resume {
display: flex;
}

/* 左邊 */
.left {
width: 30%;
background-color: #2c3e50;
color: white;
padding: 20px;
text-align: center;
}

/* 右邊 */
.right {
width: 70%;
padding: 30px;
line-height: 1.6;
}

/* 上面圓形 */
.photo {
width: 120px;
height: 120px;
border-radius: 50%;
object-fit: cover;
}

/* 🔥下面大圖（你要的） */
.photo-rect {
width: 250px;
height: 250px;
object-fit: cover;
margin-top: 20px;
}

/* 標題線 */
.right h2 {
border-bottom: 2px solid #ccc;
padding-bottom: 5px;
}
</style>
</head>

<body>

<div class="resume">

<div class="left">
<img src="images/me.jpeg" class="photo">
<h2>張芯瑜</h2>
<p>亞洲大學學生</p>
<p>學號：114055057</p>
<p>年級：一年級</p>
</div>

<div class="right">

<h1>張芯瑜</h1>

<h2>學歷</h2>
<p>亞洲大學 室內設計系 一年級</p>

<h2>個人簡介</h2>
<p>我是亞洲大學一年級學生，對室內設計充滿興趣，喜歡觀察空間與設計，希望未來成為設計師。</p>

<h2>職業目標</h2>
<p>希望未來能進入設計相關產業，提升自己的實務能力與創意表現。</p>

<h2>技能</h2>
<ul>
<li>AutoCAD</li>
<li>空間規劃</li>
<li>手繪設計</li>
</ul>

<h2>興趣</h2>
<ul>
<li>拍照</li>
<li>唱歌</li>
</ul>

<!-- 🔥你要的大方形照片 -->
<img src="images/photo.jpg" class="photo-rect">

</div>

</div>

</body>
</html>
