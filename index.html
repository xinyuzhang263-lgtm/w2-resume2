<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>張芯瑜 履歷</title>

<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background-color: #f5f5f5;
}

/* 整體卡片 */
.resume {
display: flex;
max-width: 900px;
margin: 40px auto;
background: white;
box-shadow: 0 5px 20px rgba(0,0,0,0.1);
border-radius: 10px;
overflow: hidden;
}

/* 左邊 */
.left {
width: 30%;
background-color: #2c3e50;
color: white;
text-align: center;
padding: 30px 20px;
}

.photo {
width: 120px;
height: 120px;
border-radius: 50%;
object-fit: cover;
}

.photo-rect {
width: 200px;
height: 200px;
object-fit: cover;
margin-top: 20px;
}

/* 右邊 */
.right {
width: 70%;
padding: 30px;
}

.section {
margin-bottom: 25px;
}

.section h2 {
border-left: 5px solid #3498db;
padding-left: 10px;
margin-bottom: 10px;
}

ul {
padding-left: 20px;
}

/* 🎵 音樂播放器（升級版） */
.music-player{
position: fixed;
bottom: 20px;
right: 20px;
display: flex;
align-items: center;
gap: 12px;
background: rgba(0,0,0,0.75);
padding: 12px 15px;
border-radius: 15px;
color: white;
backdrop-filter: blur(8px);
}

#playBtn{
width: 40px;
height: 40px;
border-radius: 50%;
border: none;
cursor: pointer;
font-size: 16px;
background: #3498db;
color: white;
transition: 0.3s;
}

#playBtn:hover{
transform: scale(1.1);
}

.music-info{
font-size: 12px;
}

.bar{
width: 120px;
height: 5px;
background: rgba(255,255,255,0.3);
border-radius: 5px;
margin-top: 5px;
overflow: hidden;
}

#progress{
height: 100%;
width: 0%;
background: #1abc9c;
}
</style>
</head>

<body>

<div class="resume">

<!-- 左邊 -->
<div class="left">
<img src="images/me.jpeg" class="photo">
<h2>張芯瑜</h2>
<p>亞洲大學學生</p>
<p>學號：114055057</p>

<img src="images/photo.jpg" class="photo-rect">
</div>

<!-- 右邊 -->
<div class="right">
<h1>張芯瑜</h1>

<div class="section">
<h2>學歷</h2>
<p>亞洲大學 室內設計系 一年級</p>
</div>

<div class="section">
<h2>個人簡介</h2>
<p>我是亞洲大學室內設計系一年級學生，對空間設計與美感充滿興趣。</p>
</div>

<div class="section">
<h2>職業目標</h2>
<p>希望未來進入室內設計產業，並創立自己的設計公司。</p>
</div>

<div class="section">
<h2>技能</h2>
<ul>
<li>AutoCAD</li>
<li>空間規劃</li>
<li>手繪設計</li>
</ul>
</div>

<div class="section">
<h2>興趣</h2>
<ul>
<li>拍照</li>
<li>聽音樂</li>
<li>設計作品</li>
</ul>
</div>

</div>
</div>

<!-- 🎵 音樂播放器 -->
<div class="music-player">
<button id="playBtn">▶</button>

<div class="music-info">
🎵 Music
<div class="bar">
<div id="progress"></div>
</div>
</div>
</div>

<audio id="bgm" loop>
<source src="music/song.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById("bgm");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");

/* 播放 / 暫停 */
playBtn.addEventListener("click", () => {
if (audio.paused) {
audio.play();
playBtn.innerHTML = "⏸";
} else {
audio.pause();
playBtn.innerHTML = "▶";
}
});

/* 進度條 */
audio.addEventListener("timeupdate", () => {
if (audio.duration) {
const percent = (audio.currentTime / audio.duration) * 100;
progress.style.width = percent + "%";
}
});

/* 點擊頁面解鎖音樂（瀏覽器限制） */
document.addEventListener("click", () => {
audio.play();
}, { once: true });
</script>

</body>
</html>
